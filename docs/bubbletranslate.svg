<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <clipPath id="globe">
      <ellipse cx="34" cy="29" rx="11" ry="8.4"/>
    </clipPath>
  </defs>

  <!-- thought bubble: puffy cloud + trailing bubbles -->
  <g fill="url(#g)">
    <circle cx="22" cy="27" r="12"/>
    <circle cx="37" cy="21" r="14.5"/>
    <circle cx="47" cy="30" r="11"/>
    <circle cx="30" cy="35" r="12.5"/>
    <circle cx="43" cy="37" r="10.5"/>
    <circle cx="18" cy="47" r="4.6"/>
    <circle cx="12" cy="55" r="3"/>
  </g>

  <!-- oval world inside -->
  <g clip-path="url(#globe)" fill="none" stroke="#fff" stroke-width="1.5">
    <line x1="23" y1="29" x2="45" y2="29"/>
    <line x1="24.5" y1="23.4" x2="43.5" y2="23.4"/>
    <line x1="24.5" y1="34.6" x2="43.5" y2="34.6"/>
    <line x1="34" y1="20.6" x2="34" y2="37.4"/>
    <ellipse cx="34" cy="29" rx="4" ry="8.4"/>
  </g>
  <ellipse cx="34" cy="29" rx="11" ry="8.4" fill="none" stroke="#fff" stroke-width="1.8"/>
</svg>
