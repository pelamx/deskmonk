name: CI

permissions:
  contents: write

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Release builds talk to these servers; an unset repository variable builds without them.
env:
  DESKMONK_TELEMETRY_URL: ${{ vars.DESKMONK_TELEMETRY_URL }}
  DESKMONK_LICENSE_URL: ${{ vars.DESKMONK_LICENSE_URL }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # One app for Apple Silicon and Intel Macs.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos.sh
      # The Mac App Store build (sandbox + StoreKit) must keep compiling and linking; it is uploaded by hand.
      - run: cargo build --features appstore --bin deskmonk
        env:
          CARGO_TARGET_DIR: target/appstore
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # AppImage, tar.gz, .deb, .rpm and Arch package per CPU, built on AlmaLinux 8 (glibc 2.28) so they run on nearly every distro from 2019 on.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin deskmonk --bin deskmonk-tui
      - run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target/release/deskmonk.exe, target/release/deskmonk-tui.exe, README.md -DestinationPath dist/deskmonk-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  # Microsoft Store package. Only on a tag: its identity must match the Partner Center reservation,
  # so a package built from a branch could never be submitted anyway. The Store signs the upload, so
  # what comes out here is unsigned — which is why it stays a CI artifact and is not attached to the
  # release: nobody can install an unsigned .msix, and offering one would only produce support mail.
  msix:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A wrong identity is rejected on upload, so stop here rather than build something that looks
      # submittable and is not.
      - name: The Store package needs its Partner Center identity
        run: test -n "$MSIX_IDENTITY_NAME" && test -n "$MSIX_PUBLISHER"
        shell: bash
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: dist/*.msix

  # Static terminal UI: runs on any Linux of that CPU (servers, cloud images).
  tui-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }} --no-default-features --features tui --bin deskmonk-tui
      - run: mkdir dist && cp target/${{ matrix.target }}/release/deskmonk-tui dist/deskmonk-tui-linux-${TARGET%%-*}
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.target }}
          path: dist/*

  # A version tag (v0.4.0) publishes everything above as one GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, macos, linux, windows, tui-musl]
    runs-on: ubuntu-latest
    steps:
      # Without the license server the apps unlock Pro for everyone; without telemetry nothing is counted.
      - name: Release builds know their servers
        run: test -n "$DESKMONK_LICENSE_URL" && test -n "$DESKMONK_TELEMETRY_URL"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
