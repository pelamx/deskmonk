name: CI

permissions:
  contents: write

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Release builds talk to these servers; an unset repository variable builds without them.
env:
  DESKMONK_TELEMETRY_URL: ${{ vars.DESKMONK_TELEMETRY_URL }}
  DESKMONK_LICENSE_URL: ${{ vars.DESKMONK_LICENSE_URL }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Without the servers: tests/startup.rs runs the real app, and every run would count as a new user in /admin.
      - run: env -u DESKMONK_TELEMETRY_URL -u DESKMONK_LICENSE_URL cargo test --workspace
        shell: bash

  # The website: its tests, and every platform's release file signed and pointing at files that exist (what each
  # deploy also checks), so a push that would break another platform's download or update fails here first.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node worker/predeploy.mjs --check-only
      - run: npm ci && npm test
        working-directory: worker

  # One app for Apple Silicon and Intel Macs.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos.sh
      # The Mac App Store build (sandbox + StoreKit) must keep compiling and linking; it is uploaded by hand.
      - run: cargo build --features appstore --bin deskmonk
        env:
          CARGO_TARGET_DIR: target/appstore
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # AppImage, tar.gz, .deb, .rpm and Arch package per CPU, built on AlmaLinux 8 (glibc 2.28) so they run on nearly every distro from 2019 on.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin deskmonk --bin deskmonk-tui
      - run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target/release/deskmonk.exe, target/release/deskmonk-tui.exe, README.md -DestinationPath dist/deskmonk-windows-x86_64.zip
          # What installed copies download to update themselves (src/update.rs).
          tar -czf dist/deskmonk-windows-x86_64.tar.gz -C target/release deskmonk.exe deskmonk-tui.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.tar.gz

  # Microsoft Store package. On a tag, and on demand: the identity comes from the repository
  # variables, so a package built from a branch is submittable too — and a Store submission should
  # not have to cost a public release, which is what tagging does. The Store signs the upload, so
  # what comes out here is unsigned — which is why it stays a CI artifact and is not attached to the
  # release: nobody can install an unsigned .msix, and offering one would only produce support mail.
  msix:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A wrong identity is rejected on upload, so stop here rather than build something that looks
      # submittable and is not.
      - name: The Store package needs its Partner Center identity
        run: test -n "$MSIX_IDENTITY_NAME" && test -n "$MSIX_PUBLISHER"
        shell: bash
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: dist/*.msix
      # The listing's screenshots, drawn by this build on Windows (src/store_shots.rs). No stats: not an installation.
      - run: env -u DESKMONK_TELEMETRY_URL cargo test --bin deskmonk store_shots -- --ignored
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: store-shots
          path: dist/store-shots/*.png

  # Static terminal UI: runs on any Linux of that CPU (servers, cloud images).
  tui-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }} --no-default-features --features tui --bin deskmonk-tui
      - run: mkdir dist && cp target/${{ matrix.target }}/release/deskmonk-tui dist/deskmonk-tui-linux-${TARGET%%-*}
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.target }}
          path: dist/*

  # Installs the real packages on other distros and starts the app and the password prompt, so a missing dependency
  # is found here and not by a user. deskmonk.app points nowhere: these runs must not count as installs in /admin.
  linux-install:
    needs: linux
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/deskmonk_*_amd64.deb xvfb xauth libgl1-mesa-dri
          - image: ubuntu:24.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/deskmonk_*_amd64.deb xvfb xauth libgl1-mesa-dri
          - image: debian:12
            install: apt-get update -qq && apt-get install -y -qq ./dist/deskmonk_*_amd64.deb xvfb xauth libgl1-mesa-dri
          - image: fedora:latest
            install: dnf install -y -q ./dist/deskmonk-*.x86_64.rpm xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers which
          - image: rockylinux:9
            install: dnf install -y -q ./dist/deskmonk-*.x86_64.rpm xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers which
          - image: rockylinux:8
            install: dnf install -y -q ./dist/deskmonk-*.x86_64.rpm xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers which
          - image: opensuse/tumbleweed
            install: zypper --non-interactive --no-gpg-checks install ./dist/deskmonk-*.x86_64.rpm xvfb-run xauth Mesa-dri which gawk
          - image: archlinux:latest
            install: pacman -Sy --noconfirm --needed xorg-server-xvfb xorg-xauth mesa which && pacman -U --noconfirm ./dist/deskmonk-*-x86_64.pkg.tar.zst
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-X64
          path: dist
      - run: ${{ matrix.install }}
      - name: The app and the password prompt start and keep running
        run: |
          echo "127.0.0.1 deskmonk.app" >> /etc/hosts
          export HOME=$(mktemp -d)
          # Still running after 10 s is what "starts" means: timeout's own code is 124.
          starts() {
            local code=0
            xvfb-run -a -s "-screen 0 1280x800x24" timeout 10 "$@" > run.log 2>&1 || code=$?
            grep -vE 'xkbcommon: ERROR' run.log | tail -8 || true
            echo "$* exited with $code"
            test "$code" = 124 && ! grep -qE 'panicked|^Error:' run.log
          }
          starts deskmonk
          starts deskmonk --unlock-prompt /nonexistent.desktop
          # Exits 1 with its usage text when no key is given.
          deskmonk-tui --key 2>&1 | grep deskmonk-tui || true
          test -n "$(deskmonk-tui --key 2>&1 || true)"
        shell: bash

  # The plain archive and the AppImage, without any package manager help.
  linux-archives:
    needs: linux
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-X64
          path: dist
      - run: apt-get update -qq && apt-get install -y -qq xvfb xauth libgl1-mesa-dri libx11-xcb1 libxcursor1 libxrandr2 libxi6 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libegl1 libgl1 desktop-file-utils
      - name: The archive installs into a normal user's menu and starts; the AppImage starts
        run: |
          echo "127.0.0.1 deskmonk.app" >> /etc/hosts
          useradd -m tester
          tar xzf dist/deskmonk-linux-x86_64.tar.gz -C /home/tester
          chown -R tester /home/tester
          su tester -c '~/deskmonk-linux-x86_64/install.sh'
          desktop-file-validate /home/tester/.local/share/applications/deskmonk.desktop
          grep -q '^Exec=/home/tester/.local/bin/deskmonk' /home/tester/.local/share/applications/deskmonk.desktop
          code=0; su tester -c 'cd; xvfb-run -a -s "-screen 0 1280x800x24" timeout 10 ~/.local/bin/deskmonk' > run.log 2>&1 || code=$?
          echo "installed app exited with $code"; test "$code" = 124; ! grep -qE 'panicked|^Error:' run.log
          su tester -c '~/deskmonk-linux-x86_64/install.sh --uninstall'
          test ! -e /home/tester/.local/bin/deskmonk
          chmod +x dist/*.AppImage
          export HOME=$(mktemp -d)
          code=0; APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1280x800x24" timeout 10 dist/deskMonk-*-linux-x86_64.AppImage > run.log 2>&1 || code=$?
          echo "AppImage exited with $code"; test "$code" = 124; ! grep -qE 'panicked|^Error:' run.log
        shell: bash

  # A version tag (v0.4.0) publishes everything above as one GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, macos, linux, linux-install, linux-archives, windows, tui-musl]
    runs-on: ubuntu-latest
    steps:
      # Without the license server the apps unlock Pro for everyone; without telemetry nothing is counted.
      - name: Release builds know their servers
        run: test -n "$DESKMONK_LICENSE_URL" && test -n "$DESKMONK_TELEMETRY_URL"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
