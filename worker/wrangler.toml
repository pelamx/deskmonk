name = "deskmonk"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Everything lives on deskmonk.app: the website (../docs) and, on paths with no file there,
# the API (/api/events, /api/license/*), /admin and the /buy checkout pages.
workers_dev = false
routes = [{ pattern = "deskmonk.app", custom_domain = true }]

# Every deploy first checks that it is exactly origin/master and that every platform's download and update file is
# there and signed (predeploy.mjs), so one machine's deploy can't take another platform's release off the site.
[build]
command = "node predeploy.mjs"

[assets]
directory = "../docs"
binding = "ASSETS"
# These pages are translated by the worker (src/site.ts) before they are sent; every other file is served as is.
# /ads.js has no file: the worker answers it per country.
run_worker_first = ["/", "/index.html", "/pricing", "/pricing.html", "/ads.js"]

[[d1_databases]]
binding = "DB"
database_name = "deskmonk"
database_id = "e0bfa82a-e5c0-4b68-ade8-4c5fad7b1af2"

# One cron (the free plan's 5 are shared with pelamx.com and bubbleTranslate): every minute it looks for plx payments
# whose page was closed (src/plx.ts), and at Monday 08:00 UTC it also sends the weekly summary mail (src/mail.ts).
[triggers]
crons = ["* * * * *"]

# Secret, not here: ADMIN_TOKEN (wrangler secret put ADMIN_TOKEN), the /admin password for user "admin".

# deskMonk Pro (Paddle). Still the live bubbleTranslate account (product pro_01m655e6q98g48am0eqdqfgre3), whose keys are set.
# Moving to deskMonk's own live account (product pro_01m667pf8797d2s0z3pt3wn771): once its 3 keys are set, change the prices
# to pri_01m667qxxgttbk4k2sdmaa6y5m (monthly) and pri_01m667xnt44c9x72k87xm77fy7 (yearly). Keys and prices must be from one account.
# Secrets, not here: PADDLE_CLIENT_TOKEN, PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET (wrangler secret put …).
[vars]
PADDLE_ENV = "production"
PADDLE_PRICE_MONTHLY = "pri_01m655mbyt5f86ptdtqpsggdza"
PADDLE_PRICE_YEARLY = "pri_01m655nmwqf9t6zj9bakdepxb8"

# plx (src/plx.ts): the Solana wallet that receives USDC. Empty = no "Pay with plx" button. Optional secret PLX_RPC: a Solana RPC URL.
PLX_WALLET = ""

# Mail through Resend (src/mail.ts): the buyer's license key, the app's contact form, the weekly summary.
# deskmonk.app must be verified in Resend. Secret, not here: RESEND_API_KEY. Without it nothing is mailed.
MAIL_FROM = "deskMonk <support@deskmonk.app>"
OWNER_EMAIL = "pelamx@deskmonk.app"
