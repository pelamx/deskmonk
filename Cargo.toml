[workspace]
members = ["server"]

[package]
name = "deskmonk"
version = "0.5.3"
edition = "2024"

[features]
default = ["gui", "tui"]
gui = ["dep:eframe", "dep:rfd", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
tui = ["dep:ratatui"]
# Mac App Store build: sandboxed, Pro through Apple subscriptions (StoreKit), no App Lock. See packaging/appstore/.
appstore = ["gui"]

[[bin]]
name = "deskmonk"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "deskmonk-tui"
path = "src/bin/deskmonk-tui.rs"
required-features = ["tui"]

[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
dirs = "6"
eframe = { version = "0.35", optional = true, features = ["glow"] }
ratatui = { version = "0.30", optional = true }
rfd = { version = "0.17.2", optional = true }
serde_json = "1"
getrandom = "0.3"
ed25519-dalek = "2"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
trash = "5.2.9"
ureq = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via eframe; used to hide the app when its window is closed, and for app icons.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSString", "NSGeometry", "NSURL", "NSData", "NSError", "NSArray"] }

[target.'cfg(unix)'.dependencies]
# Already in the tree; statvfs and page-cache control for the disk speed test.
libc = "0.2"

# macOS 27's dyld rejects some stripped proc-macro dylibs ("mis-aligned LINKEDIT string pool"), which rustc reports as "can't find crate".
[profile.release.build-override]
strip = false

[dev-dependencies]
# Runs the real GUI invisibly and clicks its widgets, without touching the keyboard or mouse (src/gui_tests.rs).
egui_kittest = { version = "0.35", default-features = false, features = ["eframe"] }
